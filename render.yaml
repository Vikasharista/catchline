services:
  - type: web
    name: catchline
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_MODEL
        value: anthropic/claude-sonnet-4-5
      - key: LLM_FALLBACK
        value: openai/gpt-4o-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_DAILY_BUDGET_USD
        value: "3.0"
      - key: LLM_CHAT_MAX_TOKENS
        value: "1200"
      - key: LLM_CHAT_RATE_LIMIT_COUNT
        value: "15"
      - key: LLM_CHAT_RATE_LIMIT_WINDOW_S
        value: "600"
      - key: DATABASE_URL
        value: sqlite:////app/data/db.sqlite3
