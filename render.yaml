services:
  - type: web
    name: catchline
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_MODEL
        value: openai/gpt-4o
      - key: LLM_FALLBACK
        value: openai/gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////app/data/db.sqlite3
