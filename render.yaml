services:
  - type: web
    name: catchline
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_MODEL
        value: anthropic/claude-sonnet-4-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////app/data/db.sqlite3
