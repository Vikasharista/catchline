{% extends "base.html" %}
{% block content %}
<div class="card" style="margin-bottom:16px">
  <h2 style="font-size:15px;margin-bottom:12px">Comparison grid — EUR/kg net DAP Boulogne</h2>
  <div id="grid" style="overflow:auto"></div>
</div>

<div class="card">
  <h2 style="font-size:15px;margin-bottom:4px">Qualified vendors</h2>
  <p style="font-size:11.5px;color:var(--cl-text-muted);margin-bottom:12px">Per SKU/line: suppliers who are eligible, not blocked on that line, with a price and a delivery SLA (MOQ + lead time from the questionnaire).</p>
  <div id="qualified-vendors" style="overflow:auto"></div>
</div>

<script>
const RFX_ID = {{ rfx_id }};

async function loadQualifiedVendors() {
  const el = document.getElementById('qualified-vendors');
  let data;
  try {
    const res = await fetch(`/api/rfx/${RFX_ID}/qualified-vendors`);
    if (!res.ok) throw new Error(res.statusText || `HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    el.innerHTML = `<div style="font-size:12px;color:var(--cl-red)">Something went wrong: ${err.message}</div>`;
    return;
  }
  if (!data.rows.length) {
    el.innerHTML = '<div style="font-size:13px;color:var(--cl-text-faint)">No quotes extracted yet.</div>';
    return;
  }
  const rows = [...data.rows].sort((a, b) => (a.line_id + a.supplier_name).localeCompare(b.line_id + b.supplier_name));
  el.innerHTML = `<table style="border-collapse:collapse;font-size:12px;width:100%">
    <tr style="text-align:left;color:var(--cl-text-faint)">
      <th style="padding:6px;border-bottom:1px solid var(--cl-border)">Line</th>
      <th style="padding:6px;border-bottom:1px solid var(--cl-border)">Species</th>
      <th style="padding:6px;border-bottom:1px solid var(--cl-border)">Supplier</th>
      <th style="padding:6px;border-bottom:1px solid var(--cl-border);text-align:right">Price €/kg</th>
      <th style="padding:6px;border-bottom:1px solid var(--cl-border)">Eligibility</th>
      <th style="padding:6px;border-bottom:1px solid var(--cl-border)">Delivery SLA</th>
      <th style="padding:6px;border-bottom:1px solid var(--cl-border)">Qualified</th>
    </tr>
    ${rows.map(r => `<tr style="${!r.qualified ? 'opacity:0.5' : ''}">
      <td style="padding:6px;border-bottom:1px solid var(--cl-border)">${r.line_id}</td>
      <td style="padding:6px;border-bottom:1px solid var(--cl-border)">${r.species || ''}</td>
      <td style="padding:6px;border-bottom:1px solid var(--cl-border)">${r.supplier_name}</td>
      <td style="padding:6px;border-bottom:1px solid var(--cl-border);text-align:right">${r.price_eur_kg_net_dap != null ? r.price_eur_kg_net_dap.toFixed(2) : '—'}</td>
      <td style="padding:6px;border-bottom:1px solid var(--cl-border)"><span class="badge ${r.eligibility === 'eligible' ? 'badge-success' : r.eligibility === 'conditional' ? 'badge-amber' : 'badge-red'}">${r.eligibility}${r.line_blocked ? ' (blocked)' : ''}</span></td>
      <td style="padding:6px;border-bottom:1px solid var(--cl-border);font-size:11px">${r.delivery_sla || '—'}</td>
      <td style="padding:6px;border-bottom:1px solid var(--cl-border)">${r.qualified ? '✓' : '—'}</td>
    </tr>`).join('')}
  </table>`;
}

async function load() {
  const grid = document.getElementById('grid');
  let data;
  try {
    const res = await fetch(`/api/rfx/${RFX_ID}/comparison`);
    if (!res.ok) throw new Error(res.statusText || `HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    grid.innerHTML = `<div style="font-size:12px;color:var(--cl-red)">Something went wrong: ${err.message}</div>`;
    return;
  }

  if (!data.headers.length) {
    grid.innerHTML = '<div style="font-size:13px;color:var(--cl-text-faint)">No suppliers yet — load the reference RFx on the Draft screen and simulate the inbox first.</div>';
    return;
  }
  if (!data.rows.length) {
    grid.innerHTML = '<div style="font-size:13px;color:var(--cl-text-faint)">No extracted quotes yet — run extraction on documents in the Inbox screen first.</div>';
    return;
  }

  const lineIds = [...new Set(data.rows.map(r => r.line_id))].sort();

  const cellFor = (lineId, supplierId) => data.rows.find(r => r.line_id === lineId && r.supplier_id === supplierId);

  let html = '<table style="border-collapse:collapse;font-size:12px;width:100%">';
  html += '<tr><th style="text-align:left;padding:6px;border-bottom:1px solid var(--cl-border)">Line</th>';
  for (const h of data.headers) {
    html += `<th style="padding:6px;border-bottom:1px solid var(--cl-border)">
      ${h.name}<br><span class="badge badge-neutral" style="margin-top:4px">${h.eligibility}</span>
      <div style="font-size:10px;color:var(--cl-text-faint)">${h.coverage} lines</div>
    </th>`;
  }
  html += '</tr>';

  for (const lineId of lineIds) {
    html += `<tr><td style="padding:6px;border-bottom:1px solid var(--cl-border)">${lineId}</td>`;
    const rowVals = data.headers.map(h => cellFor(lineId, h.supplier_id)?.eur_kg_net_dap).filter(v => v != null);
    const min = rowVals.length ? Math.min(...rowVals) : null;
    for (const h of data.headers) {
      const cell = cellFor(lineId, h.supplier_id);
      const isMin = cell && cell.eur_kg_net_dap === min;
      html += `<td style="padding:6px;border-bottom:1px solid var(--cl-border);text-align:right;${isMin ? 'font-weight:700;color:var(--cl-success)' : ''}">
        ${cell ? cell.eur_kg_net_dap?.toFixed(2) ?? '—' : '<span style="color:var(--cl-text-faint)">not quoted</span>'}
      </td>`;
    }
    html += '</tr>';
  }
  html += '</table>';
  document.getElementById('grid').innerHTML = html;
}

load();
loadQualifiedVendors();
</script>
{% endblock %}
