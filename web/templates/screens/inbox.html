{% extends "base.html" %}
{% block content %}
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h2 style="font-size:15px">Supplier replies</h2>
    <button class="btn btn-primary" id="simulate-btn">Simulate replies arriving</button>
  </div>
  <div id="summary-strip" style="font-size:12px;color:var(--cl-text-muted);margin-bottom:14px"></div>
  <div id="doc-list" style="display:flex;flex-direction:column;gap:8px"></div>
</div>

<script>
const RFX_ID = {{ rfx_id }};
let docs = [];

function renderDocs() {
  const list = document.getElementById('doc-list');
  list.innerHTML = docs.map(d => `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px">
      <div>
        <strong style="font-size:13px">${d.filename}</strong>
        <span style="font-size:11px;color:var(--cl-text-faint);margin-left:8px">supplier ${d.supplier_id}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="status-${d.id}" class="badge badge-neutral">received</span>
        <button class="btn btn-secondary" style="height:26px;font-size:11px" onclick="extractDoc(${d.id})">Extract</button>
      </div>
    </div>`).join('');
  document.getElementById('summary-strip').textContent = `${docs.length} document(s) in inbox.`;
}

async function extractDoc(id) {
  document.getElementById(`status-${id}`).textContent = 'extracting…';
  const res = await fetch(`/api/documents/${id}/extract?live=false`, { method: 'POST' });
  const data = await res.json();
  document.getElementById(`status-${id}`).textContent = data.status + (data.items != null ? ` · ${data.items} items` : '');
}

document.getElementById('simulate-btn').addEventListener('click', async () => {
  const res = await fetch(`/api/rfx/${RFX_ID}/inbox/simulate`, { method: 'POST' });
  const data = await res.json();
  docs = docs.concat(data.documents);
  renderDocs();
  if (data.unmatched.length) {
    document.getElementById('summary-strip').textContent += ` ${data.unmatched.length} file(s) need a supplier picked manually.`;
  }
});

renderDocs();
</script>
{% endblock %}
