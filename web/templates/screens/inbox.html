{% extends "base.html" %}
{% block content %}
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h2 style="font-size:15px">Supplier replies</h2>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" id="simulate-btn">Simulate replies arriving</button>
      <button class="btn btn-primary" id="seed-extract-all-btn">Seed &amp; extract all</button>
    </div>
  </div>
  <p style="font-size:11.5px;color:var(--cl-text-muted);margin-bottom:8px">
    "Seed &amp; extract all" copies all 5 supplier replies and 4 certificates into the inbox and runs real extraction
    on each (a live LLM call, or its cache) — populates Review, Compare and Award with real data in one step.
  </p>
  <div id="error-banner" style="display:none;background:var(--cl-red-bg);color:var(--cl-red);border-radius:8px;padding:10px 12px;font-size:12px;margin-bottom:12px"></div>
  <div id="summary-strip" style="font-size:12px;color:var(--cl-text-muted);margin-bottom:14px"></div>
  <div id="doc-list" style="display:flex;flex-direction:column;gap:8px"></div>
</div>

<script>
const RFX_ID = {{ rfx_id }};
let docs = [];

async function safeFetch(url, opts) {
  const res = await fetch(url, opts);
  let body = null;
  try { body = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) {
    const msg = (body && body.detail && (body.detail.message || body.detail.error || JSON.stringify(body.detail)))
      || (body && JSON.stringify(body))
      || res.statusText
      || `HTTP ${res.status}`;
    throw new Error(msg);
  }
  return body;
}

function showError(err) {
  const banner = document.getElementById('error-banner');
  banner.textContent = `Something went wrong: ${err.message}`;
  banner.style.display = 'block';
}

function clearError() {
  document.getElementById('error-banner').style.display = 'none';
}

function renderDocs() {
  const list = document.getElementById('doc-list');
  list.innerHTML = docs.map(d => `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px">
      <div>
        <strong style="font-size:13px">${d.filename}</strong>
        <span style="font-size:11px;color:var(--cl-text-faint);margin-left:8px">supplier ${d.supplier_id}${d.kind === 'certificate' ? ' · certificate' : ''}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="status-${d.id}" class="badge badge-neutral">${d.initial_status || 'received'}</span>
        <button class="btn btn-secondary" style="height:26px;font-size:11px" onclick="extractDoc(${d.id})">Extract</button>
      </div>
    </div>`).join('');
  document.getElementById('summary-strip').textContent = `${docs.length} document(s) in inbox.`;
}

async function extractDoc(id) {
  const statusEl = document.getElementById(`status-${id}`);
  statusEl.textContent = 'extracting…';
  try {
    clearError();
    const data = await safeFetch(`/api/documents/${id}/extract?live=false`, { method: 'POST' });
    statusEl.textContent = data.status + (data.items != null ? ` · ${data.items} items` : '');
  } catch (err) {
    statusEl.textContent = 'failed';
    showError(err);
  }
}

document.getElementById('simulate-btn').addEventListener('click', async () => {
  try {
    clearError();
    const data = await safeFetch(`/api/rfx/${RFX_ID}/inbox/simulate`, { method: 'POST' });
    docs = docs.concat(data.documents);
    renderDocs();
    if (data.unmatched.length) {
      document.getElementById('summary-strip').textContent += ` ${data.unmatched.length} file(s) need a supplier picked manually.`;
    }
  } catch (err) { showError(err); }
});

document.getElementById('seed-extract-all-btn').addEventListener('click', async () => {
  const btn = document.getElementById('seed-extract-all-btn');
  btn.disabled = true;
  btn.textContent = 'Seeding & extracting… (can take a minute or two)';
  try {
    clearError();
    const data = await safeFetch(`/api/rfx/${RFX_ID}/inbox/seed-and-extract-all?live=false`, { method: 'POST' });
    docs = data.extracted.map(e => ({ id: e.id, filename: e.filename, supplier_id: null, kind: null, initial_status: `${e.status}${e.items != null ? ' · ' + e.items + ' items' : ''}` }))
      .concat(data.failed.map(f => ({ id: f.id, filename: f.filename, supplier_id: null, kind: null, initial_status: 'failed' })));
    renderDocs();
    document.getElementById('summary-strip').textContent =
      `${data.documents_registered} document(s) registered · ${data.extracted.length} extracted · ${data.failed.length} failed`
      + (data.unmatched.length ? ` · ${data.unmatched.length} unmatched` : '');
    if (data.failed.length) {
      showError(new Error(data.failed.map(f => `${f.filename}: ${f.error}`).join('; ')));
    }
  } catch (err) {
    showError(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Seed & extract all';
  }
});

renderDocs();
</script>
{% endblock %}
